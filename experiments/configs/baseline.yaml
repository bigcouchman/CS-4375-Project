project:
  name: "CS-4375 CDAE Denoising"
  team:
    - "Casey Nguyen (CXN220034)"
    - "Nguyen Phuc Do (NPD220001)"

dataset:
  name: "CIFAR-10"
  root: "data"
  normalize: true
  max_train_samples: 4800
  max_test_samples: 1200

training:
  mode: "single"
  k_folds: 5
  epochs: 80
  batch_size: 32
  learning_rate: 0.001
  lr_decay: 0.995
  lr_decay_every: 1
  early_stopping_patience: 12
  min_delta: 0.0
  seed: 42

noise:
  type: "gaussian"
  std: 0.05
  salt_pepper_amount: 0.01

model:
  input_shape: [32, 32, 3]
  latent_channels: 96
  regularization: 0.05

classification:
  enabled: true
  algorithm: "custom_softmax_regression"
  epochs: 20
  batch_size: 32
  learning_rate: 0.003
  weight_decay: 0.002

logging:
  output_csv: "experiments/logs/experiment_runs.csv"
  predictions_output_csv: "reports/tables/full_predictions.csv"
